# SMOKE TEST: subset kecil, 2 epoch, 1 seed. Hanya untuk memastikan pipeline jalan;
# angkanya TIDAK boleh dipakai di paper.
# Satu file untuk lokal dan Colab; hanya blok `profiles` yang berbeda per mesin.
# Mengubah data/split/preprocess/model/training (kecuali daftar seed) WAJIB disertai run_name
# baru: E2–E4 menolak berjalan jika train_hash berbeda dengan run E1.

run_name: smoke

data:
  classes: [NORM, MI, STTC, CD, HYP]
  max_records_per_partition: 300

split:                                  # per patient_id
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_fold: 9                           # dibagi per pasien: VAL_A (seleksi epoch, T) / VAL_B (conformal)
  test_fold: 10
  val_a_fraction: 0.5
  seed: 20261028

preprocess:
  highpass_hz: null                     # null = records100 apa adanya (seperti notebook & benchmark)
  highpass_order: 2

model:
  name: resnet1d18

training:
  seeds: [0]
  epochs: 2
  batch_size: 256
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine                     # cosine per langkah | none
  pos_weight: none                      # none | balanced (w_k = N-/N+); none menjaga kalibrasi
  amp: bf16                             # bf16 (CUDA) | none
  eval_batch_size: 1024
  cudnn_benchmark: true

evaluation:
  ece_bins: 15
  bootstrap_resamples: 50
  bootstrap_seed: 7
  triage_specificity: 0.90

conformal:                              # E2
  alphas: [0.01, 0.025, 0.05, 0.10, 0.20]
  methods: [M0, M1, M2, M3]

validity:                               # E3 (T2): split acak kalibrasi/uji pada positif TEST
  alphas: [0.10, 0.20]
  n_splits: 100
  pac_delta: 0.10
  n_mc: 50
  seed: 11
  model_seed: null                      # null = seed pertama yang selesai

subgroups:                              # E4
  alpha: 0.10
  min_positives: 5
  age_edges: [50, 65, 80]
  quality_columns: [baseline_drift, static_noise, burst_noise, electrodes_problems]

calibration:                            # E5: pembanding kalibrasi post-hoc (fit VAL_A)
  methods: [none, temp, temp_k, platt, isotonic, hist]
  n_bins: 15
  ref_alpha: 0.10                       # α untuk uji invariansi conformal M1 vs M2

conformal_benchmark:                    # E6: pembanding prediktor himpunan (kalibrasi VAL_B)
  alphas: [0.05, 0.10, 0.20]
  pac_delta: 0.10

profiles:
  local:
    raw_dir: data/raw/ptbxl
    cache_dir: data/processed/ptbxl100
    runs_dir: results/smoke
    test_access_log: results/smoke/TEST_ACCESS_LOG_smoke.md
    device: cuda
  colab:
    raw_dir: "/content/drive/MyDrive/ptb xl/ptb-xl-a-large-publicly-available-electrocardiography-dataset-1.0.3"
    cache_dir: "/content/drive/MyDrive/ptbxl_conformal/cache"
    runs_dir: "/content/drive/MyDrive/ptbxl_conformal/results/smoke"
    test_access_log: "/content/drive/MyDrive/ptbxl_conformal/results/smoke/TEST_ACCESS_LOG_smoke.md"
    device: cuda
