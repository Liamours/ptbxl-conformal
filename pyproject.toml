[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgdig"
version = "0.2.0"
description = "PTB-XL 5-superclass classification, calibration, and conformal prediction"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "torch",
    "wfdb",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
ignore = ["N803", "N806"]  # X, M, T, N: notasi matematis

[tool.ruff.lint.per-file-ignores]
"scripts/build_colab.py" = ["E501"]  # teks templat sel notebook

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
